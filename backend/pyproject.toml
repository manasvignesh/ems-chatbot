[project]
name = "ems-chatbot-backend"
version = "1.0.0"
description = "Production RAG AI Event Assistant for MLRIT CIE EMS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "httpx>=0.27.0",
    "google-genai>=0.3.0",
    "supabase>=2.8.0",
    "pypdf>=4.3.0",
    "beautifulsoup4>=4.12.0",
    "python-multipart>=0.0.9",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["app", "."]
asyncio_mode = "auto"
